<div class="dream-plate" data-plate hidden><img alt=""></div>
<div class="dream-inventory" data-inventory hidden>
  <ul class="overlay-glass" data-abilities aria-label="Abilities" hidden>
    <li data-ability="bubbleShield"><span aria-hidden="true">◯</span> Bubble Shield</li>
    <li data-ability="ultimate"><span aria-hidden="true">✦</span> Ultimate</li>
  </ul>
  <details class="overlay-glass">
    <summary>Inventory</summary>
    <ol aria-label="Carried items" data-items></ol>
    <template data-item><li></li></template>
    <div data-pager hidden>
      <button type="button" data-prev>Previous</button>
      <span data-page role="status"></span>
      <button type="button" data-next>Next</button>
    </div>
  </details>
</div>
